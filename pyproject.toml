[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slang-half-life"
version = "0.1.0"
description = "How long does a slang term live? Measuring the rise, peak, and decay of Gen-Z slang from Wiktionary lookups."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GalacticChill" }]
keywords = ["data-science", "time-series", "survival-analysis", "slang", "language", "wiktionary"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
slang-half-life = "slang_half_life.cli:main"

[tool.setuptools.packages.find]
include = ["slang_half_life*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
